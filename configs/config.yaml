corpus:
  squad_subset_size: 20000
  arxiv_max_docs: 3000
  eval_query_size: 500

chunking:
  strategies: [fixed, sentence, semantic]
  fixed:
    chunk_size: 512
    overlap: 64
  sentence:
    max_tokens: 400
  semantic:
    max_tokens: 450

retrieval:
  dense_model: BAAI/bge-small-en-v1.5
  reranker_model: BAAI/bge-reranker-base
  top_k: 5
  hybrid_alpha: 0.5

generation:
  model: gpt-4o-mini
  max_tokens: 512
  temperature: 0.1
  cache_ttl_hours: 168

evaluation:
  n_bootstrap: 500
  ci_level: 0.95
