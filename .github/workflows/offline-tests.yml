name: Offline deterministic tests
on:
  workflow_dispatch:
jobs:
  offline:
    runs-on: windows-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      RAGSCOPE_HOME: D:/RAGScope_Runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit locked test dependencies
        run: python -m pip install --require-hashes -r requirements-v2.lock
      - name: Check syntax without loading models
        run: python -m compileall -q ragscope scripts
      - name: Run offline unit and recovery fixtures
        run: python -m pytest tests/unit -q -p no:cacheprovider
